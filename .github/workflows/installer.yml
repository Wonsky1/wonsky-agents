name: Installer compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer and updater tests (temporary homes only)
        run: python -B -m unittest discover -s tests -v
      - name: Packaged UI search and invocation contracts
        run: python -B -m unittest discover -s skills/ui-ux-pro-max/scripts/tests -v
      - name: Python structure checker tests (temporary source fixtures only)
        run: python -B -m unittest discover -s skills/implementation-guide/scripts/tests -v
      - name: Python structure of maintained utilities
        run: python -B skills/implementation-guide/scripts/check_structure.py --repo-root . install.py update.py scripts skills/implementation-guide/scripts skills/repository-context/scripts
      - name: Context helper tests
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s skills/repository-context/scripts/tests -v
      - name: Native Unix launcher
        if: runner.os != 'Windows'
        run: sh install.sh --dry-run --targets codex
      - name: Native Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install.ps1 --dry-run --targets codex
